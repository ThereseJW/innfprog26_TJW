<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS2: Fargepalett</title>
    <style>
        #colors {
            width: 100%;
            max-width: 900px;
            margin: 100px auto;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        #colors > div {
            box-sizing: border-box;
            width: 31%;
            height: 150px;
            position: relative;
            cursor: pointer;
            cursor: hand;
        }

        #colors > div > span {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #fff;
            padding: .5rem;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <section id="colors">

    </section>
    <button id="changeAll">Bytte ut tre tilfeldig farger</button>
    <script>
    //Tillate tegn i en hex-kode: 
    const chars = "ABCDEF0123456789"
    //Gjør klar lagring av hex-koder
    const hexCodes = []

    //Lage en funksjon som retunerer en hex-kode:
    function hexGenerator() {
        //1: Lag klar en variable som kan lagre hex-koden:
        let hex = "#"
        //2: gjøre et tilfeldig utvalg 6 ganger:
            for(teller = 0; teller < 6; teller++) {
                const randomChar = chars[Math.floor(Math.random() * 16)]
                hex += randomChar
            }
        return hex
    }

    //Kjør hexGenerator 6 ganger, og lagre hvert resultat i hexCodes:
    for(t = 0; t < 6; t++) {
        hexCodes.push(hexGenerator())
    }

    //Lage funksjon for å bytte farge på en bestemt index i hexCodes:
    function changeHex(index) {
        hexCodes.splice(index, 1, hexGenerator())
        printColor()
    }  
    
    function recursiveIndexSelector(arrayToCheck) {
        //1 Check: arrayToCheck has 3 elements
        if(arrayToCheck.length === 3) {
            return
        } else {
            const indexToCheck = selectRandomIndex (hexCodes)
            //Dose indexToCheck exist in the array already?
            if(arrayToCheck.includes(indexToCheck)) {
                recursiveIndexSelector(arrayToCheck)
            } else {
                arrayToCheck.push(indexToCheck)
                recursiveIndexSelector(arrayToCheck)
            }
        }
    }

    //Lage en funksjon for å velge en tilfeldig index:
    function selectRandomIndex(array) {
        const randomIndex = Math.floor(Math.random() * array.length)
        return randomIndex
    }


    document.getElementById("changeAll").addEventListener("click", function() {
        //Velg tre tilfeldige indexer mellom 0 og 5
        const randomIndexes = []
        
        recursiveIndexSelector(randomIndexes)

        console.log(randomIndexes)

        randomIndexes.map(i => hexCodes[i] = hexGenerator())

        printColor()

        //Kjøre en .splice mot hexCodes for hver av de tre indexene
    })


    //Skrive ut HTML-elementer for hver farge i hexCodes:
    function printColor() {
        //Gjøre klar variable for å bygge HTML-streng
        let colorHTML = ""
        //Bruke .map for å bygge HTML-boks for hver farge i hexCodes-arrayen
        hexCodes.map((h, i) => {
             colorHTML += `
                <div onClick="changeHex(${i})" style="background-color: ${h}">
                    <span>${h}</span>
                </div>
            `
        })  
        //Skrive ut ferdig HTML-streng til #colors
        document.getElementById("colors").innerHTML = colorHTML
    }

    //Første kjøring av printColors når siden lastes inn:
    printColor()

    </script>
</body>
</html>
